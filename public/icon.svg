  <rect x="216" y="320" width="592" height="408" rx="100" fill="#FFFFFF" />

  <!-- card slot band -->
  <rect x="216" y="462" width="592" height="88" fill="#EAF4FF" />

  <!-- clasp -->
  <rect x="618" y="442" width="224" height="128" rx="64" fill="#D6E9FF" />
  <circle cx="716" cy="506" r="27" fill="#0A84FF" />
</svg>
